<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Royaume de la Salamandre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Idée : une maquette de la France posée sur une mer bleu nuit ; les textes sont des fiches ivoire, grosses lettres, mots clés surlignés au fluo comme dans le classeur. */
:root{
  color-scheme:light;
  --nuit:#0d2038; --mer:#17406b; --azur:#2c5fb6; --azur-clair:#74a8f2;
  --or:#f3c04a; --feu:#f0642a; --ivoire:#fcf8ee; --encre:#14203a; --gris:#5b6680;
  --fluo:#ffe55e; --ok:#1f8a4c; --non:#c23b2e;
  --titre:"Fraunces",Georgia,serif; --texte:"Lexend","Trebuchet MS",Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--nuit);color:var(--encre);font-family:var(--texte);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--feu);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labs{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;
  background:var(--ivoire);color:var(--encre);font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.45);will-change:transform}
.lab i{width:18px;height:18px;border-radius:50%;background:var(--or);box-shadow:0 0 0 0 rgba(243,192,74,.9);animation:pouls 1.8s infinite;flex:none}
.lab.fait i{animation:none;background:#b9c0cc}
.lab.or i{animation:none;background:var(--or);box-shadow:inset 0 0 0 3px #b9851a}
.loin .lab{padding:6px}.loin .lab span{display:none}.loin .lab i{width:22px;height:22px}
@keyframes pouls{70%{box-shadow:0 0 0 12px rgba(243,192,74,0)}100%{box-shadow:0 0 0 0 rgba(243,192,74,0)}}
#hud{position:fixed;z-index:2;left:0;right:0;top:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;pointer-events:none}
#hud>*{pointer-events:auto}
.roi{background:rgba(13,32,56,.86);color:#fff;border-radius:14px;padding:8px 14px;border:2px solid var(--or);max-width:62%}
.roi b{display:block;font-family:var(--titre);font-size:22px;line-height:1.1;color:var(--or)}
.roi small{display:block;font-size:13px;opacity:.92;margin-top:2px}
.roi em{display:block;font-style:normal;font-size:13px;margin-top:5px;color:#ffe9b5}
.outils{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.btn{background:var(--ivoire);border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.4);min-height:44px}
.btn.or{background:var(--or)}
.btn.feu{background:var(--feu);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
#ctl{position:fixed;z-index:2;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#ctl button{width:44px;height:44px;border-radius:50%;background:rgba(252,248,238,.93);font-size:22px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#legende{position:fixed;z-index:2;left:12px;bottom:92px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#fff;background:rgba(13,32,56,.75);padding:7px 10px;border-radius:10px}
#legende span{display:flex;align-items:center;gap:6px}
#legende i{width:14px;height:14px;border-radius:3px;display:inline-block}
#rois{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(13,32,56,.92) 35%)}
#rois button{flex:1;min-width:0;background:rgba(252,248,238,.16);color:#fff;border-radius:12px;padding:7px 4px;border:2px solid transparent;min-height:60px}
#rois button b{display:block;font-family:var(--titre);font-size:15px;line-height:1.15}
#rois button small{font-size:12px;opacity:.9}
#rois button.ici{background:var(--ivoire);color:var(--encre);border-color:var(--or)}
#rois button.ferme{opacity:.5}
#panneau{position:fixed;z-index:3;left:0;right:0;bottom:0;max-height:64%;background:var(--ivoire);border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
#panneau[hidden],#voile[hidden],#toast[hidden]{display:none}
.tete{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:2px solid #eadfc6}
.tete h2{font-family:var(--titre);font-size:22px;line-height:1.15;flex:1;text-wrap:balance}
.tete h2 small{display:block;font-family:var(--texte);font-size:13px;font-weight:500;color:var(--gris)}
.x{width:44px;height:44px;border-radius:50%;background:#eadfc6;font-size:20px;font-weight:700;flex:none}
.pas{display:flex;gap:5px;padding:8px 16px 0}
.pas i{flex:1;height:6px;border-radius:3px;background:#e6dcc4}.pas i.vu{background:var(--azur)}.pas i.jeu{background:#f0c9b4}.pas i.jeu.vu{background:var(--feu)}
.corps{padding:12px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.lire{font-size:21px;line-height:1.6;max-width:34em}
.lire strong,.q strong,.fiche strong{background:linear-gradient(transparent 12%,var(--fluo) 12%,var(--fluo) 92%,transparent 92%);padding:0 3px;border-radius:3px;font-weight:700}
.pied{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid #eadfc6}
.pied .btn{box-shadow:none;border:2px solid var(--encre)}
.pied .suite{flex:1;background:var(--azur);color:#fff;border-color:var(--azur);position:relative;overflow:hidden}
.pied .suite[disabled]{opacity:1;background:#9fb3d6;border-color:#9fb3d6}
.pied .suite[disabled]::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(255,255,255,.35);transform-origin:left;animation:attente var(--t,1.5s) linear forwards}
@keyframes attente{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.q{font-size:20px;line-height:1.5;font-weight:500;margin-bottom:12px}
.choix{display:flex;flex-direction:column;gap:10px}
.choix button{text-align:left;font-size:19px;line-height:1.4;padding:13px 14px;border-radius:14px;background:#fff;border:2px solid #cfc4a8}
.choix button.juste{background:#dff3e6;border-color:var(--ok)}
.choix button.faux{background:#f9dedb;border-color:var(--non);opacity:.7}
.choix.bacs{flex-direction:row;flex-wrap:wrap}.choix.bacs button{flex:1 1 40%;text-align:center;font-weight:700}
.retour{font-size:18px;line-height:1.5;margin-top:12px;min-height:1.5em}
.retour.ok{color:var(--ok);font-weight:700}.retour.non{color:var(--non);font-weight:700}
.carte-jeu{font-size:20px;line-height:1.45;background:#fff;border:2px dashed var(--azur);border-radius:14px;padding:14px;margin-bottom:12px;text-align:center;font-weight:500}
.dessin{width:100%;max-width:440px;display:block;margin:0 auto 10px;border-radius:12px;border:2px solid #cfc4a8;background:#fff;touch-action:manipulation}
.dessin .zone{cursor:pointer}.dessin .trouve{filter:drop-shadow(0 0 4px #1f8a4c)}
.plomb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.plomb button,.plomb span{width:52px;height:60px;border-radius:8px;background:#5d6470;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--titre)}
.plomb button b,.plomb span b{transform:scaleX(-1);display:block}
.plomb span.vide{background:#e6dcc4}
.plomb button[disabled]{opacity:.25}
.feuille{background:#fff;border:2px solid #cfc4a8;border-radius:8px;padding:10px;font-family:var(--titre);font-size:38px;letter-spacing:.14em;text-align:center;margin:8px auto;max-width:300px}
.sceau{width:110px;height:110px;margin:4px auto 10px;display:block}
.liens{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.liens a{display:block;padding:11px 13px;border-radius:12px;background:#fff;border:2px solid #cfc4a8;color:var(--azur);font-weight:700;font-size:17px;line-height:1.35;text-decoration:none}
.liens a small{display:block;color:var(--gris);font-weight:500;font-size:13px}
#voile{position:fixed;inset:0;z-index:4;background:rgba(8,18,34,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#fiche{background:var(--ivoire);border-radius:20px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#fiche.large{max-width:1060px}
.fiche{padding:16px 18px;overflow-y:auto;font-size:19px;line-height:1.55}
.fiche h3{font-family:var(--titre);font-size:21px;margin:14px 0 6px}
.fiche p{margin:0 0 10px;max-width:34em}
.fiche ul{padding-left:1.1em;margin:0 0 10px}.fiche li{margin-bottom:6px}
.grand{font-family:var(--titre);font-size:30px;line-height:1.1;margin-bottom:10px;text-wrap:balance}
.onglets{display:flex;gap:6px;padding:0 14px;flex-wrap:wrap}
.onglets button{padding:9px 12px;border-radius:10px 10px 0 0;font-weight:700;font-size:16px;background:#eadfc6;min-height:44px}
.onglets button.ici{background:var(--azur);color:#fff}
.tete,.onglets,.pied{flex:none}
.arbre-info{flex:none;padding:10px 16px;font-size:18px;line-height:1.45;background:#fff7d6;border-bottom:2px solid #eadfc6;min-height:64px}
.arbre-zone{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;background:#fff}
.arbre-zone svg{display:block;width:1010px;height:800px}
.noeud{cursor:pointer}.noeud rect{fill:#fff;stroke:#8a8f9c;stroke-width:2}
.noeud.roi rect{fill:#fff3cf;stroke:#b9851a;stroke-width:3}
.noeud.sel rect{stroke:var(--feu);stroke-width:5}
.noeud.cache rect{fill:#e9e6df;stroke-dasharray:6 5}
.noeud text{font-family:var(--texte);font-size:15px;fill:var(--encre);text-anchor:middle;pointer-events:none}
.noeud text.nom{font-weight:700;font-size:16px}
.lst{list-style:none;padding:0}.lst li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eadfc6;font-size:18px}
.pt{width:18px;height:18px;border-radius:50%;background:#e1d8c2;flex:none}.pt.arg{background:#b9c0cc}.pt.or{background:var(--or);box-shadow:inset 0 0 0 3px #b9851a}
#toast{position:fixed;z-index:5;left:50%;top:96px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:12px 16px;border-radius:12px;font-size:17px;line-height:1.4;max-width:min(92%,460px);text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.sans3d #labs{position:fixed;inset:150px 12px 90px 12px;overflow:auto;pointer-events:auto;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.sans3d .lab{position:static;transform:none!important;font-size:17px}.sans3d #ctl,.sans3d #legende{display:none}
@media (min-width:900px){
  #panneau{left:auto;right:16px;top:16px;bottom:96px;width:460px;max-height:none;border-radius:20px}
  .lab{font-size:16px}.roi b{font-size:26px}
  .outils{flex-direction:row}
  #panneau:not([hidden]) ~ #hud .outils{visibility:hidden}
}
@media (prefers-reduced-motion:reduce){.lab i{animation:none}.pied .suite[disabled]::after{animation-duration:.01s}}

/* ---- version 2 ---- */
#legende[hidden]{display:none}.frise-zone,.arbre-zone{min-height:0}
:root{--lettres:#2c5fb6;--arts:#c4572e;--pouvoir:#7a4aa0;--guerre:#b3362b;--antique:#7d6e4e;--monde:#1f8a86}
.lab{padding:4px 10px 4px 4px;gap:5px}
.lab i{width:26px;height:26px;font-style:normal;font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--or)}
.lab.fait i{background:#c9cfd9}.lab.or i{background:var(--or);box-shadow:inset 0 0 0 3px #b9851a}
.lab.fait span::after,.lab.or span::after{content:" ✓"}
.loin .lab{padding:3px}.loin .lab i{width:26px;height:26px}
.outils{gap:6px}.outils .btn{padding:7px 12px;font-size:15px;min-height:40px}
#sauts{position:fixed;z-index:2;left:12px;top:112px;display:flex;flex-direction:column;gap:6px}
#sauts button,#bas button{background:rgba(13,32,56,.82);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;min-height:36px;text-align:left}
#bas{position:fixed;z-index:2;left:12px;bottom:84px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;max-width:70%}
#bas #b-retour{background:var(--ivoire);color:var(--encre);border-color:var(--or)}
#bas #b-roi{background:var(--feu);border-color:#fff;animation:pouls 1.8s infinite}
#legende{position:static;font-size:12.5px;line-height:1.5}
#legende b{display:block;margin-top:4px;font-size:12px;opacity:.8;font-weight:500}
#ctl button{width:42px;height:42px}
#rois button{padding:6px 2px;min-height:56px}#rois button b{font-size:13.5px}#rois button small{font-size:11px}
.tete.cat{color:#fff;border-bottom:0;border-radius:20px 20px 0 0;padding:10px 14px}
.tete.cat h2 small{color:rgba(255,255,255,.9)}
.tete.cat .x{background:rgba(255,255,255,.25);color:#fff}
.tete .emb{font-size:30px;line-height:1;flex:none}
.pas{padding:10px 16px 2px}
.pas button{flex:1;height:14px;border-radius:7px;background:#e6dcc4;padding:0;position:relative}
.pas button::after{content:"";position:absolute;inset:-12px 0}
.pas button.vu{background:#9db7e6}.pas button.ici{background:var(--azur);box-shadow:0 0 0 3px rgba(44,95,182,.25)}
.pas button.jeu{background:#f3cdb9}.pas button.jeu.vu{background:#f3a27f}.pas button.jeu.ici{background:var(--feu)}
.pas button[disabled]{cursor:default}
.etq{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px;margin-bottom:8px;color:#fff}
.bloc{border-left:6px solid transparent;padding-left:12px}
.bloc.ant{border-color:var(--antique)}.bloc.ant .etq{background:var(--antique)}
.bloc.ita{border-color:var(--arts)}.bloc.ita .etq{background:var(--arts)}
.bloc.fra{border-color:var(--azur)}.bloc.fra .etq{background:var(--azur)}
.bloc.lec{border-color:#e0b800}.bloc.lec .etq{background:var(--fluo);color:var(--encre)}
.pied{flex-wrap:wrap}
.pied .btn{padding:10px 12px}
.aussi{margin-top:14px;padding:12px;border-radius:14px;background:#fff;border:2px solid var(--arts);font-size:18px;line-height:1.45}
.aussi .btn{margin-top:8px;border:2px solid var(--encre);box-shadow:none}
.frise-zone{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;background:#fff;border-radius:0 0 20px 20px}
.frise{position:relative}
.fr-couloir{position:absolute;left:0;right:0}
.fr-nom{position:sticky;left:8px;display:inline-block;font-weight:700;font-size:14px;padding:3px 9px;border-radius:8px;color:#fff;z-index:2}
.fr-axe{position:absolute;left:0;right:0;height:52px;background:#f4eedd;border-top:2px solid #cfc4a8;border-bottom:2px solid #cfc4a8}
.fr-roi{position:absolute;top:2px;height:22px;border-radius:6px;background:var(--or);font-size:13px;font-weight:700;line-height:22px;padding:0 8px;white-space:nowrap;overflow:hidden;border:1px solid #b9851a}
.fr-an{position:absolute;top:28px;font-size:13px;color:var(--gris);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.fr-trait{position:absolute;top:0;bottom:0;width:1px;background:#e9e2cf}
.fr-puce{position:absolute;height:40px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:10px;font-size:14px;font-weight:700;white-space:nowrap;border:2px solid;background:#fff;color:var(--encre)}
.fr-puce small{font-weight:500;color:var(--gris);font-variant-numeric:tabular-nums}
.fr-puce.vu{background:#fff7d6}.fr-puce.ferme{opacity:.45}
.lst button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;font-size:18px}
.lst li{padding:0}
.pied .suite[disabled]{color:#fff}
.noeud.indice rect{stroke:var(--feu);stroke-width:6;animation:clign 1s infinite}
@keyframes clign{50%{fill:#ffd9c7}}
.fz{overflow-y:auto;flex:1;min-height:0;background:#fff;border-radius:0 0 20px 20px;padding:0 10px 18px;position:relative;-webkit-overflow-scrolling:touch}
.fz-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr 50px 1fr;gap:6px;background:#fff;padding:8px 0;border-bottom:2px solid #eadfc6}
.fz-h span{color:#fff;font-weight:700;font-size:14px;line-height:1.2;padding:6px 6px;border-radius:8px;text-align:center}
.fz-roi{background:var(--or);border:1px solid #b9851a;border-radius:10px;padding:7px 12px;font-family:var(--titre);font-weight:800;font-size:19px;margin:14px 0 8px}
.fz-roi small{display:block;font-family:var(--texte);font-weight:500;font-size:13.5px}
.fz-l{display:grid;grid-template-columns:1fr 50px 1fr;gap:6px;align-items:start;padding:5px 0;border-bottom:1px dashed #e4dcc6}
.fz-an{text-align:center;font-weight:700;font-size:15px;background:#f4eedd;border-radius:8px;padding:7px 0;font-variant-numeric:tabular-nums;line-height:1.15}
.fz-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.fz-e{display:block;width:100%;text-align:left;background:#fff;border:2px solid;border-left-width:7px;border-radius:10px;padding:7px 8px;font-size:15.5px;line-height:1.3;font-weight:700;overflow-wrap:anywhere}
.fz-e small{display:block;font-weight:500;color:var(--gris);font-size:13px}
.fz-e.vu{background:#fff7d6}.fz-e[disabled]{opacity:.45;cursor:default}
@media (min-width:700px){.fz-e{font-size:17px;padding:9px 12px}.fz-h span{font-size:16px}}
@media (max-width:899px){
  #panneau:not([hidden]) ~ #ctl,#panneau:not([hidden]) ~ #sauts,#panneau:not([hidden]) ~ #bas,#panneau:not([hidden]) ~ #rois{display:none}
  #panneau:not([hidden]) ~ #hud .outils{display:none}
  .roi b{font-size:19px}.roi{padding:6px 12px}
}
@media (min-width:900px){#sauts{top:130px}.tete.cat{border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<canvas id="c" aria-label="Carte en relief de l'Europe à la Renaissance"></canvas>
<div id="labs"></div>
<section id="panneau" hidden aria-live="polite">
  <div class="tete cat" id="p-tete"><span class="emb" id="p-emb"></span><h2 id="p-titre"></h2><button class="x" id="p-x" aria-label="Fermer et revenir à la carte">✕</button></div>
  <div class="pas" id="p-pas"></div>
  <div class="corps" id="p-corps"></div>
  <div class="pied" id="p-pied"></div>
</section>
<header id="hud">
  <div class="roi"><b id="h-roi"></b><small id="h-sous"></small><em id="h-but"></em></div>
  <div class="outils">
    <button class="btn or" id="b-frise">Frise</button>
    <button class="btn or" id="b-arbre">Arbre</button>
    <button class="btn" id="b-carnet">Carnet</button>
  </div>
</header>
<div id="sauts" aria-label="Aller vite sur la carte">
  <button data-s="fr">France</button><button data-s="it">Italie</button><button data-s="or">Orient</button><button data-s="tout">Tout voir</button>
</div>
<div id="ctl">
  <button id="z-plus" aria-label="Zoomer">+</button>
  <button id="z-moins" aria-label="Dézoomer">−</button>
  <button id="t-g" aria-label="Tourner la carte à gauche">↺</button>
  <button id="t-d" aria-label="Tourner la carte à droite">↻</button>
</div>
<div id="bas">
  <div id="legende" hidden>
    <span><i style="background:#2c5fb6"></i>Domaine du roi de France</span>
    <span><i style="background:#c9a35a"></i>Pas encore au roi</span>
    <span><i style="background:#74a8f2"></i>Gagné par le roi</span>
    <span><i style="background:#d8b384"></i>Italie</span>
    <b>Les traits qui bougent</b>
    <span><i style="background:#f3c04a;border-radius:50%"></i>Artistes en voyage</span>

 {roi:"Louis XI",ans:"1450 – 1483",sous:"Le monde change",noeud:"l11",
  intro:["Vers **1450**, le Moyen Âge se termine. Sur ta frise, les **Temps modernes** commencent en 1492. Mais tout se prépare déjà !","Trois grandes nouveautés arrivent : l'**imprimerie**, la **Renaissance** des arts en Italie, et le retour des savoirs des **Grecs** et des **Romains**.","La carte est grande. Les boutons **France**, **Italie** et **Orient** te font voyager vite. Tu peux toujours **revenir en arrière**. Et cherche les **salamandres** orange cachées !"],
  fin:"**1483.** Le roi Louis XI meurt. Son fils n'a que 13 ans. **Touche le nouveau roi dans l'arbre.**",suiv:"c8",aide:"C'est le fils de Louis XI : regarde juste en dessous de lui."},
 {roi:"Charles VIII",ans:"1483 – 1498",sous:"Le roi qui découvre l'Italie",noeud:"c8",
  intro:["**1483.** Charles VIII devient roi. En Italie, la Renaissance est en pleine fleur.","Le jeune roi va y partir en guerre… et revenir **émerveillé**.","Regarde bien les deux côtés des Alpes : que se passe-t-il **en France** ? Et **en Italie** au même moment ?"],
  fin:"**1498.** Charles VIII meurt. Il n'a pas d'enfant vivant. La couronne passe à son plus proche cousin. **Touche le nouveau roi dans l'arbre.**",suiv:"l12",aide:"Cherche dans la branche du milieu : la famille d'Orléans."},
 {roi:"Louis XII",ans:"1498 – 1515",sous:"Le « Père du peuple »",noeud:"l12",
  intro:["**1498.** Louis XII, cousin de Charles VIII, devient roi. Il a 36 ans.","Lui aussi rêve de l'**Italie**. Là-bas, Léonard de Vinci, Michel-Ange et Raphaël créent leurs chefs-d'œuvre.","Pendant ce temps, un petit garçon grandit en France. Il s'appelle **François**…"],
  fin:"**1515.** Louis XII meurt sans fils. À cette époque, une fille ne peut pas recevoir la couronne. **Qui sera roi ? Touche-le dans l'arbre.**",suiv:"f1",aide:"C'est un cousin de la branche d'Angoulême. Il a épousé Claude, la fille du roi."},
 {roi:"François Ier",ans:"1515 – 1547",sous:"Protecteur des arts et des lettres",noeud:"f1",
  intro:["**1515.** François Ier a 20 ans. Il est roi de France ! C'est environ 250 ans après Louis IX.","Sur ta frise, nous sommes au début des **Temps modernes**, au **XVIe siècle**.","Il veut les plus beaux **arts** et les plus beaux **livres** du monde. Pour cela, il regarde vers l'**Italie**… et vers l'**Antiquité**."],
  fin:"**1547.** François Ier meurt. Son fils aîné, le dauphin François, est mort en 1536. **Qui devient roi ? Touche-le dans l'arbre.**",suiv:"h2",aide:"C'est le deuxième fils de François Ier."},
 {roi:"Henri II",ans:"1547 – 1559",sous:"Le temps des poètes",noeud:"h2",
  intro:["**1547.** Henri II a 28 ans. Tu l'as vu enfant sur la miniature de ta leçon, à côté de son père.","Les graines semées par François Ier poussent : les **poètes** et les **écrivains** français deviennent célèbres.","Ils veulent faire aussi bien que les **Grecs** et les **Romains**… mais en **français** !"],
  fin:"",suiv:null}

 {id:"mayence",e:0,n:"Mayence",c:"Gutenberg invente l'imprimerie",y:1450,k:"L",s:"E",lon:8.27,lat:50.0,m:"presse",d:"vers 1450",f:[
  "Avant, on copiait les livres **à la main**. Il fallait des mois pour faire un seul livre !",
  "Vers 1450, à Mayence, l'Allemand **Gutenberg** met au point l'**imprimerie**. Il fabrique des petites lettres en métal, que l'on peut déplacer et réutiliser.",
  "On met de l'encre sur les lettres, on presse une feuille dessus… et la page est imprimée. On peut recommencer des centaines de fois.",
  "Son premier grand livre est une **Bible**, en latin. Il en imprime environ 180 exemplaires.",
  "@L Ta leçon donne la date de **1453**. Les historiens disent « vers 1450 » : Gutenberg a travaillé plusieurs années en secret."],
  j:{t:"presse"}},
 {id:"constantinople",e:0,n:"Constantinople",c:"Les savants grecs s'enfuient",y:1453,k:"Q",s:"E",lon:28.95,lat:41.0,m:"coupole",d:"1453",f:[
  "**Constantinople** est une immense ville, à la porte de l'Asie. On y parle **grec** depuis plus de mille ans.",
  "Dans ses bibliothèques dorment des trésors : les livres des savants et des poètes de la **Grèce antique**.",
  "En **1453**, la ville est prise par les Turcs ottomans. Des savants grecs partent vers l'**Italie**. Dans leurs bagages : leurs précieux manuscrits !",
  "@A En Italie, on redécouvre ainsi **Homère**, **Platon**, **Aristote**… On se met à apprendre le grec pour pouvoir les lire."],
  j:{t:"quiz",q:"Qu'apportent les savants grecs en Italie ?",o:["Des manuscrits de la Grèce antique.","Des canons.","Des coffres remplis d'or."],back:2},v:"florence0"},
 {id:"athenes",e:0,n:"Athènes",c:"Les Grecs de l'Antiquité",y:1446,k:"Q",s:"E",lon:23.7,lat:37.95,m:"temple",d:"Antiquité",f:[
  "Remontons le temps : 2 000 ans avant François Ier ! C'est l'**Antiquité**. Voici Athènes, la plus célèbre ville grecque.",
  "Les **Grecs** inventent le théâtre, la philosophie, les Jeux olympiques. Leurs temples ont des **colonnes** et un toit en triangle : le **fronton**.",
  "Leurs sculpteurs étudient le **corps humain**. Ils le montrent tel qu'il est, souvent nu, avec de belles proportions.",
  "Plus tard, les **Romains** admirent les Grecs. Ils copient leurs statues, adoptent leurs dieux et écrivent en **latin**.",
  "@A Notre mot **alphabet** vient des deux premières lettres grecques : **alpha** et **bêta**. Beaucoup de mots français cachent une racine grecque ou latine."],
  j:{t:"tri",q:"Une racine ancienne se cache dans ce mot. Que veut-elle dire ?",bacs:["Livre (biblio, en grec)","Terre (géo, en grec)","Eau (aqua, en latin)"],items:[["bibliothèque",0],["géographie",1],["aquarium",2],["Bible",0],["géométrie",1],["aqueduc",2]]},v:"rome0"},
 {id:"rome0",e:0,n:"Rome",c:"Les ruines de la Rome antique",y:1458,k:"Q",s:"I",lon:12.5,lat:41.9,m:"temple",d:"XVe siècle",f:[
  "À Rome, les monuments de l'Antiquité sont partout… mais en **ruines**. Des vaches broutent sur l'ancien forum !",
  "Les artistes italiens viennent les mesurer et les dessiner : colonnes, arcs, **coupoles**.",
  "@A L'architecte **Brunelleschi** étudie le Panthéon des Romains. Puis il construit à Florence une coupole géante, la plus grande de son temps.",
  "Des savants cherchent aussi les vieux textes **latins** oubliés dans les monastères. On les appelle les **humanistes**."],
  j:{t:"tri",q:"D'où cela vient-il ?",bacs:["De l'Antiquité","Nouveauté du XVe siècle"],items:[["Les colonnes et les frontons",0],["Les dieux de la mythologie",0],["L'imprimerie",1],["Les coupoles",0],["La peinture à l'huile",1],["Les statues de corps nus",0]]},l:["vh"]},
 {id:"florence0",e:0,n:"Florence",c:"Les Médicis, mécènes",y:1469,k:"A",s:"I",lon:11.25,lat:43.77,m:"dome",d:"1469",f:[
  "Voici **Florence**. C'est ici que naît la **Renaissance**, au XVe siècle.",
  "@L La Renaissance est un mouvement artistique né en **Italie** au XVe siècle. Il sera rapporté en France par le roi François Ier.",
  "Renaissance veut dire « naître à nouveau ». Ce qui renaît, c'est la beauté de l'art des **Grecs** et des **Romains**.",
  "La riche famille **Médicis** dirige la ville. **Laurent le Magnifique** paie les artistes et les savants : c'est un **mécène**.",
  "@A À Florence, on se réunit pour lire **Platon**, un philosophe grec. On traduit ses livres en latin, pour que toute l'Europe puisse les lire."],
  j:{t:"quiz",q:"Que veut dire le mot Renaissance ?",o:["Naître à nouveau : la beauté de l'art antique revient.","Le roi vient de naître.","Une nouvelle guerre commence."],back:2},l:["vre"]},
 {id:"sorbonne",e:0,n:"Paris",c:"Première imprimerie de France",y:1470,k:"L",s:"F",lon:2.35,lat:48.86,m:"ville",d:"1470",f:[
  "En **1470**, la première imprimerie de France s'installe à Paris, dans le collège de la **Sorbonne**.",
  "Trois imprimeurs sont venus exprès d'Allemagne. Leurs premiers livres sont en **latin**, pour les étudiants.",
  "Trois ans plus tard, **Lyon** a aussi son imprimerie. Bientôt, on imprime dans toute la France.",
  "@I On imprime déjà à Rome et à Venise. Les Italiens inventent de nouvelles formes de lettres, rondes et faciles à lire. Ce sont celles de tes livres !"],
  j:{t:"quiz",q:"Où s'installe la première imprimerie de France ?",o:["À Paris, à la Sorbonne.","Au château de Chambord.","À Marseille."],back:0},v:"mayence"},

 {id:"amboise1",e:1,n:"Amboise",c:"Charles VIII embellit Amboise",y:1496,k:"A",s:"F",lon:.85,lat:47.35,m:"fort",d:"1495 – 1498",f:[
  "Le roi **Charles VIII** est né dans ce château d'Amboise, en 1470. Il devient roi à 13 ans.",
  "En 1494, il part faire la guerre en **Italie**. Là-bas, il découvre des palais et des jardins magnifiques.",
  "@L Les rois et les seigneurs sont **émerveillés** par la richesse des villes et la splendeur des palais italiens. Rentrés en France, leurs forteresses leur semblent laides et tristes.",
  "Charles VIII ramène 22 artistes et artisans italiens : sculpteurs, jardiniers, menuisiers… La Renaissance entre en France !",
  "En 1498, le roi se cogne la tête contre une porte trop basse. Il en meurt, sans enfant vivant."],
  j:{t:"quiz",q:"Pourquoi Charles VIII veut-il changer son château ?",o:["Il a vu les beaux palais d'Italie.","Son château a brûlé.","Il veut se cacher de ses ennemis."],back:2},v:"naples"},
 {id:"naples",e:1,n:"Naples",c:"Début des guerres d'Italie",y:1494,k:"G",s:"I",lon:14.25,lat:40.85,m:"bataille",d:"1494 – 1495",f:[
  "Charles VIII pense que le royaume de **Naples** doit lui appartenir. Il traverse les Alpes avec une grande armée.",
  "Il entre dans Naples en 1495. Mais les Italiens s'unissent contre lui. Il doit repartir.",
  "À Naples, il admire les jardins et la bibliothèque du roi. Il fait emporter en France plus de **1 100 livres** !",
  "C'est le début des **guerres d'Italie**. Elles vont durer plus de 60 ans, avec quatre rois de France."],
  j:{t:"quiz",q:"Que rapporte Charles VIII d'Italie ?",o:["Des livres, des artistes et le goût de l'art italien.","Un nouveau royaume.","Un troupeau d'éléphants."],back:2}},
 {id:"florence1",e:1,n:"Florence",c:"Botticelli peint Vénus",y:1485,k:"A",s:"I",lon:11.25,lat:43.77,m:"dome",d:"vers 1485",f:[
  "Le peintre **Botticelli** travaille pour les Médicis. Vers 1485, il peint *La Naissance de Vénus*.",
  "@A **Vénus** est la déesse romaine de l'Amour et de la Beauté. Les Grecs l'appelaient **Aphrodite**. Ce n'est pas une scène religieuse : c'est la **mythologie**.",
  "@L La peinture de la Renaissance est très différente de celle du Moyen Âge. Elle cherche à **ressembler à la réalité** le plus possible.",
  "Botticelli peint Vénus comme une **statue antique** : debout, nue, avec un corps aux belles proportions."],
  j:{t:"venus"},apres:"Les historiens pensent que Botticelli a peint ce tableau vers 1485. Ta leçon écrit 1482 : personne ne connaît la date exacte.",l:["va"]},
 {id:"milan1",e:1,n:"Milan",c:"Léonard peint La Cène",y:1490,k:"A",s:"I",lon:9.19,lat:45.46,m:"ville",d:"1490 – 1498",f:[
  "À Milan vit un génie : **Léonard de Vinci**. Il est peintre, ingénieur, musicien, architecte…",
  "De 1495 à 1498, il peint *La Cène* sur le mur d'un couvent. Les personnages semblent vivants.",
  "Léonard étudie le **corps humain**. Il mesure tout ! Vers 1490, il dessine l'**homme de Vitruve**.",
  "@A **Vitruve** était un architecte **romain** de l'Antiquité. Il a écrit que le corps d'un homme bien fait entre dans un cercle et dans un carré. Léonard vérifie !",
  "@L La longueur des bras étendus d'un homme est **égale à sa hauteur**."],
  j:{t:"vitruve"},apres:"Essaie chez toi avec un mètre : mesure ta taille, puis tes bras étendus. Est-ce presque pareil ?",l:["vi","lv"],v:"florence1"},
 {id:"venise1",e:1,n:"Venise",c:"Alde Manuce imprime les Grecs",y:1500,k:"L",s:"I",lon:12.33,lat:45.44,m:"venise",d:"1494 – 1501",f:[
  "**Venise** est une ville bâtie sur l'eau. C'est aussi la capitale des imprimeurs !",
  "En 1494, **Alde Manuce** y ouvre son atelier. Son rêve : imprimer tous les grands livres des **Grecs** anciens.",
  "@A Des savants grecs, venus de Constantinople, l'aident à corriger les textes. Dans son atelier, on parle **grec** !",
  "Alde invente le **livre de poche** : un petit format que l'on peut emporter partout. Il invente aussi l'écriture penchée : l'***italique***.",
  "@F On imprime surtout à Paris et à Lyon. Les livres d'Alde y arrivent vite… et les imprimeurs de Lyon les copient !"],
  j:{t:"quiz",q:"Quelle écriture Alde Manuce invente-t-il ?",o:["L'italique, l'écriture penchée.","L'écriture à l'envers.","L'écriture en relief."],back:3},v:"lyon1"},
 {id:"lyon1",e:1,n:"Lyon",c:"Lyon, ville des imprimeurs",y:1489,k:"L",s:"F",lon:4.83,lat:45.76,m:"ville",d:"vers 1490",f:[
  "**Lyon** est sur la route de l'Italie. Quatre fois par an, de grandes **foires** attirent des marchands de toute l'Europe.",
  "Les marchands italiens y apportent de la soie, des épices… et des **idées nouvelles**.",
  "Vers 1500, Lyon compte des dizaines d'ateliers d'imprimerie. C'est la deuxième ville du livre en France, après Paris.",
  "@I Venise est alors la plus grande ville d'imprimeurs de toute l'Europe."],
  j:{t:"quiz",q:"Pourquoi les idées d'Italie arrivent-elles vite à Lyon ?",o:["Lyon est sur la route de l'Italie, avec de grandes foires.","Lyon est au bord de la mer.","Le roi y habite toute l'année."],back:0},v:"venise1"},

 {id:"blois",e:2,n:"Blois",c:"Louis XII et sa bibliothèque",y:1501,k:"P",s:"F",lon:1.33,lat:47.59,m:"chateau",d:"1498 – 1515",f:[
  "**Louis XII** est né à Blois. Devenu roi, il installe la Cour dans ce château.",
  "Il fait construire une aile en briques rouges et en pierres blanches. Les fenêtres sont grandes : on n'a plus peur des attaques.",
  "Son emblème est le **porc-épic**. On le voit sculpté au-dessus de la porte.",
  "À Blois, le roi rassemble une grande **bibliothèque**. Il y ajoute les livres rapportés d'Italie.",
  "Il baisse les impôts. Le peuple l'appelle le **« Père du peuple »**."],
  j:{t:"quiz",q:"Quel animal est l'emblème de Louis XII ?",o:["Le porc-épic.","La salamandre.","Le lion."],back:2},v:"milan2"},
 {id:"milan2",e:2,n:"Milan",c:"Louis XII prend Milan",y:1499,k:"G",s:"I",lon:9.19,lat:45.46,m:"bataille",d:"1499",f:[
  "Louis XII veut le duché de **Milan** : sa grand-mère était une princesse de Milan. Il s'en empare en 1499.",
  "Il admire *La Cène* de Léonard de Vinci. On raconte qu'il aurait voulu emporter le mur en France !",
  "Le roi fait transporter à Blois la bibliothèque des ducs de Milan : près de **mille livres** précieux.",
  "@I Léonard quitte Milan. Il part pour Venise, puis retourne à Florence."],
  j:{t:"quiz",q:"Que rapporte Louis XII de Milan ?",o:["Une bibliothèque de livres précieux.","La Joconde.","Un porc-épic vivant."],back:2}},
 {id:"florence2",e:2,n:"Florence",c:"Le David et La Joconde",y:1504,k:"A",s:"I",lon:11.25,lat:43.77,m:"dome",d:"1501 – 1506",f:[
  "À Florence, deux génies travaillent en même temps… et ne s'aiment pas beaucoup !",
  "**Michel-Ange** sculpte un *David* géant dans un seul bloc de marbre. Il mesure plus de 5 mètres !",
  "@A Son David est nu et musclé, comme les statues des dieux **grecs**.",
  "**Léonard de Vinci** commence le portrait d'une dame de Florence : **La Joconde**. Il y travaillera pendant des années.",
  "@F Un garçon de 10 ans grandit à Amboise. Il s'appelle François. Un jour, il invitera Léonard…"],
  j:{t:"quiz",q:"Qui sculpte le David ?",o:["Michel-Ange.","Léonard de Vinci.","Botticelli."],back:1},l:["vl"],v:"cognac"},
 {id:"rome2",e:2,n:"Rome",c:"La Sixtine et L'École d'Athènes",y:1510,k:"A",s:"I",lon:12.5,lat:41.9,m:"temple",d:"1506 – 1512",f:[
  "À **Rome**, le pape Jules II veut la plus belle ville du monde. Il appelle les meilleurs artistes.",
  "**Michel-Ange** peint le plafond de la chapelle Sixtine. Il y travaille quatre ans, la tête en l'air !",
  "**Raphaël** peint *L'École d'Athènes* : tous les grands savants grecs réunis dans un palais. Au centre : **Platon** et **Aristote**.",
  "@A En 1506, un paysan découvre dans sa vigne une statue antique : le **Laocoon**. Michel-Ange accourt pour la voir. Elle inspire tous les artistes.",
  "@L Au Moyen Âge, les peintures étaient presque toujours religieuses. On s'intéressait peu au corps humain."],
  j:{t:"tri",q:"Moyen Âge ou Renaissance ?",bacs:["Moyen Âge","Renaissance"],items:[["Des personnages nus, comme les statues antiques",1],["Presque seulement des sujets religieux",0],["Des corps aux proportions exactes",1],["Des scènes de la mythologie grecque",1],["Peu d'intérêt pour le corps humain",0],["Beaucoup de détails : cheveux, tissus, expressions",1]]},l:["va"]},
 {id:"cognac",e:2,n:"Cognac",c:"Naissance de François",y:1494,k:"P",s:"F",lon:-.33,lat:45.69,m:"chateau",d:"1494",f:[
  "Un bébé naît ici en 1494 : **François d'Angoulême**. Il n'est pas fils de roi.",
  "Son père meurt quand il a 1 an. Sa mère, **Louise de Savoie**, l'élève avec sa grande sœur **Marguerite**.",
  "Louise aime les livres. Elle fait apprendre à son fils l'italien et l'espagnol. Il adore les romans de chevalerie !",
  "Le roi Louis XII n'a pas de fils. Il fait venir son jeune cousin François à la Cour, à Amboise.",
  "En 1514, François épouse **Claude**, la fille du roi. Il a 19 ans."],
  j:{t:"quiz",q:"Pourquoi François peut-il devenir roi ?",o:["Louis XII n'a pas de fils : François est son cousin et son gendre.","Il gagne un grand tournoi.","Il achète la couronne."],back:3},v:"florence2"},

 {id:"marignan",e:3,n:"Marignan",c:"Victoire de Marignan",y:1515,k:"G",s:"I",lon:9.9,lat:45.55,m:"bataille",d:"1515",f:[
  "Nous sommes en **1515**. François Ier vient de devenir roi. Il a 20 ans.",
  "Il traverse les Alpes avec son armée et ses canons. À **Marignan**, il bat les soldats suisses.",
  "La bataille dure deux jours. François devient le maître de Milan.",
  "@I Après sa victoire, le jeune roi rencontre le pape à Bologne. Il découvre les chefs-d'œuvre de l'Italie… et rêve de les avoir en France."],
  j:{t:"quiz",q:"En quelle année a lieu la bataille de Marignan ?",o:["1515","1492","1789"],back:0},l:["qh"]},
 {id:"amboise3",e:3,n:"Amboise",c:"Léonard de Vinci en France",y:1516,k:"A",s:"F",lon:.85,lat:47.35,m:"chateau",d:"1516 – 1519",f:[
  "En 1516, François Ier invite **Léonard de Vinci** en France. Léonard a 64 ans.",
  "Il traverse les Alpes à dos de mulet. Dans ses bagages : **La Joconde** !",
  "Le roi lui offre un manoir, le Clos Lucé, tout près du château d'Amboise.",
  "Léonard imagine des machines volantes et des fêtes pour le roi. Il meurt ici en 1519. La Joconde reste en France : elle est aujourd'hui au **Louvre**.",
  "@I Raphaël décore le palais du pape. Michel-Ange sculpte pour les Médicis. L'Italie est encore le pays des artistes."],
  j:{t:"quiz",q:"Quel tableau célèbre Léonard apporte-t-il en France ?",o:["La Joconde.","La Naissance de Vénus.","La Cène."],back:1},l:["jo","inv","wd"],v:"florence2"},
 {id:"chambord",e:3,n:"Chambord",c:"Début du chantier de Chambord",y:1519,k:"A",s:"F",lon:1.75,lat:47.75,m:"chambord",d:"1519",f:[
  "En 1519, François Ier lance un chantier géant : **Chambord**. Un château pour la chasse… et pour montrer sa puissance.",
  "@L Le pont-levis est supprimé, les murailles sont percées de grandes fenêtres, les tours abattues. On construit de belles demeures, entourées de jardins.",
  "Au centre, un escalier **à double hélice** : deux personnes peuvent monter et descendre sans jamais se croiser !",
  "@A Tout est **symétrique**, avec des colonnes plates sur les murs : ces idées viennent d'Italie, donc de l'Antiquité. Mais les toits pointus restent bien français !",
  "La **salamandre**, emblème du roi, est sculptée plus de 300 fois."],
  j:{t:"chateau"},l:["gac","cps"],v:"amboise3"},
 {id:"pavie",e:3,n:"Pavie",c:"Le roi prisonnier à Pavie",y:1525,k:"G",s:"I",lon:9.0,lat:44.95,m:"bataille",d:"1525",f:[
  "Le grand rival de François Ier s'appelle **Charles Quint**. Son empire entoure la France.",
  "En 1525, à **Pavie**, l'armée française est battue. Le roi est fait **prisonnier** !",
  "Il reste enfermé un an à Madrid. Pour sortir, il doit laisser à sa place ses deux fils aînés, François et Henri, 8 et 6 ans.",
  "@L Il voulait agrandir le royaume de France, mais **ne parvint pas** à conquérir de nouveaux territoires."],
  j:{t:"quiz",q:"François Ier a-t-il réussi à garder des terres en Italie ?",o:["Non : il est battu à Pavie et doit y renoncer.","Oui, toute l'Italie.","Oui, le royaume de Naples."],back:3}},
 {id:"rome3",e:3,n:"Rome",c:"Rome pillée, les artistes s'enfuient",y:1527,k:"A",s:"I",lon:12.5,lat:41.9,m:"temple",d:"1527 – 1541",f:[
  "En **1527**, l'armée de Charles Quint attaque **Rome** et pille la ville. C'est une catastrophe.",
  "Beaucoup d'artistes s'enfuient. Certains cherchent un nouveau protecteur… comme le roi de France.",
  "@F C'est ainsi que le peintre **Rosso** arrive à Fontainebleau en 1530. Le malheur de Rome fait le bonheur de François Ier !",
  "À Rome, Michel-Ange reprend ses pinceaux. De 1536 à 1541, il peint le *Jugement dernier* : plus de 300 personnages sur un seul mur !"],
  j:{t:"quiz",q:"Pourquoi des artistes italiens quittent-ils Rome ?",o:["La ville a été pillée en 1527.","Le pape n'aime plus la peinture.","Il y fait trop chaud."],back:0},v:"fontainebleau"},
 {id:"venise3",e:3,n:"Venise",c:"Titien peint le roi sans le voir",y:1539,k:"A",s:"I",lon:12.33,lat:45.44,m:"venise",d:"vers 1539",f:[
  "À Venise travaille **Titien**, le peintre des rois et des empereurs.",
  "Vers 1539, il peint un portrait de **François Ier**. Pourtant, il ne l'a jamais rencontré !",
  "Il a copié le visage du roi sur une **médaille**. Voilà pourquoi le roi est peint de profil.",
  "@A Les médailles avec un visage de profil imitent les **pièces de monnaie romaines**, où l'on voyait les empereurs."],
  j:{t:"quiz",q:"Comment Titien connaît-il le visage du roi ?",o:["Grâce à une médaille.","Il vit à la Cour de France.","Grâce à une photographie."],back:2}},
 {id:"fontainebleau",e:3,n:"Fontainebleau",c:"Artistes italiens et bibliothèque du roi",y:1533,k:"A",s:"F",lon:2.95,lat:48.2,m:"chateau",d:"1528 – 1547",f:[
  "**Fontainebleau** est le château préféré du roi. Quand il y va, il dit qu'il rentre « chez lui ».",
  "Il fait venir des artistes italiens : **Rosso** et **Primatice**. Ils décorent une longue galerie de peintures et de sculptures.",
  "@A Le roi veut des statues antiques. Primatice va à Rome et rapporte des moulages des plus célèbres, comme le Laocoon. On en fait des copies en bronze.",
  "@L Durant toute sa vie, François Ier a collectionné les **livres**, écrits à la main ou imprimés, souvent ornés de belles miniatures.",
  "Il envoie des savants en Italie et en Orient acheter des manuscrits **grecs**. Sa bibliothèque en compte bientôt des centaines.",
  "En 1537, il décide qu'un exemplaire de chaque livre imprimé en France sera donné à sa bibliothèque. Cette règle existe toujours !"],
  j:{t:"tri",q:"Où cela se passe-t-il ?",bacs:["En France","En Italie"],items:[["Michel-Ange peint la chapelle Sixtine",1],["On construit le château de Chambord",0],["Botticelli peint La Naissance de Vénus",1],["Le roi crée une grande bibliothèque à Fontainebleau",0],["Alde Manuce invente le livre de poche",1],["Léonard de Vinci finit sa vie au Clos Lucé",0]]},v:"rome3"},
 {id:"college",e:3,n:"Paris · Collège",c:"Création du Collège de France",y:1530,k:"L",s:"F",lon:1.95,lat:49.1,m:"ville",d:"1530",f:[
  "Un grand savant conseille le roi : **Guillaume Budé**. Il lit le grec aussi bien que le français !",
  "@A Pour les **humanistes**, il faut lire les textes anciens dans leur vraie langue : le **latin**, le **grec** et l'**hébreu**.",
  "@L En **1530**, François Ier crée à Paris le **Collège de France**, où des gens très savants enseignent les langues anciennes et toutes les sciences.",
  "Les cours sont gratuits et ouverts à tous. C'est encore vrai aujourd'hui !",
  "Le roi a même invité **Érasme**, l'humaniste le plus célèbre d'Europe. Mais Érasme a préféré garder sa liberté."],
  j:{t:"quiz",q:"Qu'enseigne-t-on d'abord au Collège de France ?",o:["Les langues anciennes, comme le grec et l'hébreu.","L'escrime et la chasse.","La cuisine italienne."],back:2},l:["vh","vf"],v:"constantinople"},
 {id:"imprimeurs",e:3,n:"Paris · Imprimeurs",c:"Les imprimeurs du roi",y:1541,k:"L",s:"F",lon:2.75,lat:48.82,m:"presse",d:"1539 – 1544",f:[
  "@L François Ier favorise le développement de l'**imprimerie**, mise au point par l'Allemand Gutenberg.",
  "Il choisit des **imprimeurs du roi**, comme **Robert Estienne**. Estienne imprime de gros dictionnaires de latin et de français.",
  "@A Le roi veut de beaux livres en grec. Il commande à **Claude Garamond** de nouvelles lettres grecques : les « Grecs du roi ».",
  "Les lettres dessinées par **Garamond** sont si élégantes qu'on les utilise encore. Cherche « Garamond » dans les polices de ton ordinateur !",
  "@I À Venise, le fils d'Alde Manuce continue le travail de son père."],
  j:{t:"quiz",q:"Qui dessine les lettres appelées « Grecs du roi » ?",o:["Claude Garamond.","Gutenberg.","Léonard de Vinci."],back:2},v:"venise1"},
 {id:"villers",e:3,n:"Villers-Cotterêts",c:"Le français, langue officielle",y:1539,k:"P",s:"F",lon:3.35,lat:49.55,m:"chateau",d:"1539",f:[
  "@L François Ier veut que le roi ait un **réel pouvoir**. Il se fait aider par des conseillers, mais décide **seul** d'augmenter les impôts, sans réunir les **états généraux**.",
  "Autour de lui vit **la Cour**. Un ambassadeur de Venise écrit en 1546 que le roi est « le maître absolu ».",
  "Dans ce château, en **1539**, il signe une ordonnance très importante.",
  "Désormais, les textes officiels et les jugements seront écrits en **français**, et plus en latin. Tout le monde doit pouvoir comprendre.",
  "@L Ses ordres se terminent par : **« Car tel est notre bon plaisir »**. Cela veut dire : telle est notre volonté."],
  j:{t:"quiz",q:"Depuis 1539, dans quelle langue écrit-on les textes officiels ?",o:["En français.","En latin.","En italien."],back:3},l:["vf"]},
 {id:"chinon",e:3,n:"Chinon",c:"Rabelais écrit Gargantua",y:1534,k:"L",s:"F",lon:.1,lat:47.0,m:"livre",d:"1532 – 1534",f:[
  "Près de Chinon naît **François Rabelais**. Il est moine, puis médecin… et écrivain.",
  "@L Rabelais raconte avec verve les aventures des géants : *Gargantua* et *Pantagruel*.",
  "Ses livres sont imprimés à **Lyon**. Ils font rire. Mais ils font aussi réfléchir : comment bien apprendre ? Comment éviter la guerre ?",
  "@A Dans le livre, le géant Gargantua écrit à son fils : apprends le **grec**, le **latin** et l'hébreu, et lis tous les bons livres ! C'est le programme des humanistes.",
  "Aujourd'hui encore, on dit un repas « **gargantuesque** » pour parler d'un repas énorme !"],
  j:{t:"tri",q:"Rabelais l'a-t-il vraiment écrit ?",bacs:["C'est dans le livre","C'est inventé"],items:[["Gargantua naît par l'oreille de sa mère.",0],["Bébé, il crie : « À boire ! À boire ! »",0],["Il construit une fusée pour aller sur la Lune.",1],["Il emporte les cloches de Notre-Dame pour sa jument.",0],["Il joue au football contre Charles Quint.",1],["Il avale six pèlerins dans sa salade, sans le faire exprès.",0]]},l:["vg","vr"]},
 {id:"stmalo",e:3,n:"Saint-Malo",c:"Jacques Cartier part au Canada",y:1535,k:"M",s:"F",lon:-2.0,lat:48.65,m:"bateau",d:"1534",f:[
  "@L François Ier s'intéresse à l'Amérique. Il **encourage les explorations**, dont celles de Jacques Cartier au Canada.",
  "En **1534**, le marin **Jacques Cartier** part de Saint-Malo avec deux navires. Vingt jours plus tard, il atteint Terre-Neuve.",
  "L'année suivante, il remonte un immense fleuve, le Saint-Laurent. Il appelle ce pays **Canada**, d'un mot iroquoien qui veut dire « village ».",
  "Il rapporte de l'or et des diamants… qui sont en fait de simples cailloux !"],
  j:{t:"quiz",q:"Qu'est-ce qu'une exploration ?",o:["Un voyage pour découvrir une région que l'on ne connaît pas.","Une guerre contre un pays voisin.","Une grande fête à la Cour."],back:0},l:["vc"]},
 {id:"vannes",e:3,n:"Vannes",c:"Bretagne et Auvergne au roi",y:1531,k:"P",s:"F",lon:-2.76,lat:47.66,m:"fort",d:"1531 – 1532",f:[
  "En **1532**, à Vannes, les Bretons acceptent que la **Bretagne** soit unie pour toujours à la France. La reine Claude en était la duchesse.",
  "Un an plus tôt, le roi a pris l'**Auvergne**. Elle appartenait au duc de Bourbon, le chef de son armée, qui l'avait trahi.",
  "@L Le roi gagne de nouvelles terres pour le **domaine royal** sans en perdre aucune."],
  j:{t:"quiz",q:"Quelles régions entrent dans le domaine royal sous François Ier ?",o:["L'Auvergne et la Bretagne.","L'Italie et l'Espagne.","La Normandie et le Languedoc."],back:0}},

 {id:"chenonceau",e:4,n:"Chenonceau",c:"Le château des Dames",y:1547,k:"A",s:"F",lon:1.15,lat:47.25,m:"pont",d:"1547",f:[
  "**Henri II** offre ce château à son amie **Diane de Poitiers**.",
  "Diane fait construire un **pont** sur la rivière, le Cher. Plus tard, la reine **Catherine de Médicis** y ajoutera une galerie.",
  "Résultat : un château posé **sur l'eau**. On l'appelle le « château des Dames ».",
  "@I Catherine de Médicis vient de **Florence**. Elle apporte à la Cour le goût des fêtes, des jardins et des artistes italiens."],
  j:{t:"quiz",q:"Sur quoi est construit Chenonceau ?",o:["Sur un pont, au-dessus d'une rivière.","Au sommet d'une montagne.","Sur une île, en mer."],back:1},l:["vch"]},
 {id:"louvre",e:4,n:"Paris · Louvre",c:"Le nouveau Louvre",y:1551,k:"A",s:"F",lon:2.1,lat:49.0,m:"palais",d:"1546 – 1556",f:[
  "À Paris, le vieux château fort du **Louvre** est démoli. L'architecte **Pierre Lescot** construit à la place un palais moderne.",
  "@A Sa façade a des **colonnes** et des **frontons**, comme un temple antique.",
  "Le sculpteur **Jean Goujon** y sculpte quatre **cariatides** : des statues de femmes qui servent de colonnes.",
  "@A Les cariatides viennent de Grèce. On en voit sur un temple d'**Athènes**, vieux de 2 000 ans.",
  "@I À Rome, Michel-Ange a plus de 70 ans. Il dessine la coupole géante de la basilique Saint-Pierre."],
  j:{t:"quiz",q:"Qu'est-ce qu'une cariatide ?",o:["Une statue de femme qui sert de colonne.","Une arme de chevalier.","Une danse italienne."],back:2},v:"athenes"},
 {id:"ronsard",e:4,n:"Vendôme",c:"Ronsard et la Pléiade",y:1554,k:"L",s:"F",lon:.65,lat:47.95,m:"livre",d:"1550",f:[
  "**Pierre de Ronsard** naît près de Vendôme en 1524. Enfant, il est page à la Cour, au service des fils de François Ier.",
  "Une maladie le rend presque sourd. Il ne peut plus devenir soldat. Alors il choisit la **poésie**.",
  "@L Les poètes Ronsard et Du Bellay **s'inspirent des écrivains grecs et latins**. Ils chantent les beautés de la nature et la joie de vivre.",
  "@A Ronsard imite le Grec **Pindare** et le Romain **Horace**. Même le nom de son groupe de poètes, **la Pléiade**, vient de sept poètes grecs de l'Antiquité.",
  "Son poème le plus connu parle d'une **rose** qui ne dure qu'un jour."],
  j:{t:"quiz",q:"Trouve la rime. « Mignonne, allons voir si la rose / Qui ce matin avait… »",o:["déclose (cela veut dire : ouverte)","fleurie","poussé"],back:4},l:["vro"]},
 {id:"dubellay",e:4,n:"Liré",c:"Du Bellay défend le français",y:1549,k:"L",s:"F",lon:-1.16,lat:47.34,m:"livre",d:"1549",f:[
  "**Joachim du Bellay** naît à Liré, en Anjou. C'est l'ami de Ronsard.",
  "En 1549, il écrit un livre pour dire : le **français** est une belle langue ! On peut écrire de grands poèmes en français, pas seulement en latin.",
  "@A Son idée : faire en français ce que les Grecs et les Romains ont fait dans leur langue. Imiter les Anciens… pour les égaler !",
  "Les poètes de la Pléiade inventent même des mots nouveaux, à partir du grec et du latin."],
  j:{t:"quiz",q:"Que défend Du Bellay dans son livre de 1549 ?",o:["La langue française.","Le latin pour tout le monde.","La chasse à courre."],back:1},v:"rome4"},
 {id:"rome4",e:4,n:"Rome",c:"Du Bellay à Rome",y:1556,k:"L",s:"I",lon:12.5,lat:41.9,m:"temple",d:"1553 – 1557",f:[
  "En 1553, **Du Bellay** part à Rome. Il est le secrétaire de son cousin, un cardinal.",
  "Il se promène dans les **ruines** de la Rome antique. Elles le font rêver… et le rendent triste : même les plus grandes villes finissent en poussière.",
  "Son village d'Anjou lui manque. Il l'écrit dans un poème célèbre : *Heureux qui, comme Ulysse…*",
  "@A **Ulysse** est le héros de *L'Odyssée*, un très vieux poème grec d'**Homère**. Après la guerre de Troie, il met dix ans à rentrer chez lui !"],
  j:{t:"quiz",q:"Qui est Ulysse ?",o:["Un héros grec qui met dix ans à rentrer chez lui.","Un roi de France.","Un peintre italien."],back:3},v:"dubellay"},
 {id:"florence4",e:4,n:"Florence",c:"Vasari invente le mot Renaissance",y:1550,k:"A",s:"I",lon:11.25,lat:43.77,m:"dome",d:"1550",f:[
  "À Florence, le peintre **Giorgio Vasari** a une idée : raconter la vie des grands artistes italiens.",
  "Son livre paraît en **1550**. On y lit les histoires de Léonard, de Raphaël, de Michel-Ange…",
  "Pour parler de leur époque, Vasari emploie un mot italien : ***rinascita***. En français : **Renaissance** !",
  "@L Le XVIe siècle est appelé la **Renaissance** car, pour les hommes de ce temps, la beauté, comme l'avaient réalisée les anciens Grecs et Romains, renaît et produit des œuvres merveilleuses."],
  j:{t:"quiz",q:"Qui emploie le mot « Renaissance » pour parler des artistes ?",o:["Vasari.","Charles Quint.","Gutenberg."],back:2},l:["vre"]},
 {id:"montaigne",e:4,n:"Montaigne",c:"Montaigne, élevé en latin",y:1533,k:"L",s:"F",lon:.03,lat:44.88,m:"tour",d:"1533 – 1592",f:[
  "**Michel de Montaigne** naît ici en 1533. Son père a une drôle d'idée : on ne lui parle qu'en **latin** ! C'est sa première langue.",
  "Chaque matin, on le réveille doucement, **en musique**.",
  "Adulte, il s'installe dans une tour ronde, pleine de livres. C'est là qu'il réfléchit et qu'il écrit.",
  "@A Sur les poutres du plafond, il fait peindre ses phrases préférées, en **grec** et en **latin**. Il cite sans cesse les auteurs anciens.",
  "@L Montaigne, dans les *Essais*, fait part des réflexions que lui suggèrent ses lectures et ses voyages. Sa devise : **« Que sais-je ? »**"],
  j:{t:"tri",q:"Qui a écrit quoi ?",bacs:["Rabelais","Ronsard","Du Bellay","Montaigne"],items:[["Gargantua",0],["Les Essais",3],["Le poème de la rose",1],["Heureux qui, comme Ulysse…",2],["Pantagruel",0],["« Que sais-je ? »",3]]},apres:"Les Essais sont publiés en 1580, un peu après notre histoire.",l:["vm"]},
 {id:"calais",e:4,n:"Calais",c:"Calais, Metz, Toul et Verdun",y:1558,k:"G",s:"F",lon:1.86,lat:50.95,m:"fort",d:"1552 – 1559",f:[
  "Henri II continue la guerre contre Charles Quint. En 1552, il prend trois villes de l'Est : **Metz, Toul et Verdun**.",
  "Depuis plus de 200 ans, **Calais** appartient aux Anglais ! En janvier 1558, l'armée française la reprend en quelques jours.",
  "En 1559, la paix est signée. La France renonce à l'Italie : les **guerres d'Italie** sont finies.",
  "@I Pendant 65 ans, les soldats français ont traversé les Alpes. Ils n'ont pas gardé de terres. Mais ils ont rapporté la Renaissance."],
  j:{t:"quiz",q:"À qui appartenait Calais avant 1558 ?",o:["Aux Anglais.","Aux Italiens.","Aux Espagnols."],back:1}},
 {id:"tournoi",e:4,n:"Paris · Tournoi",c:"Mort d'Henri II",y:1559,k:"P",s:"F",lon:2.95,lat:48.6,m:"tente",d:"1559",f:[
  "Été 1559. Pour fêter la paix, le roi organise un grand **tournoi** à Paris.",
  "Henri II adore les joutes à cheval. Mais la lance de son adversaire se brise. Un éclat le blesse gravement à l'œil.",
  "Malgré les meilleurs médecins, le roi meurt dix jours plus tard.",
  "Trois de ses fils seront rois : **François II, Charles IX et Henri III**. Leur mère, Catherine de Médicis, les aidera à gouverner."],
  j:{t:"quiz",q:"Combien de fils d'Henri II deviendront rois ?",o:["Trois.","Un seul.","Aucun."],back:3}}
];
const SALAMANDRES=[
 {id:"a1",e:0,lon:9.6,lat:51.0,t:"Un copiste mettait environ **trois ans** pour copier une Bible entière à la main. Avec sa presse, Gutenberg en imprime 180 dans le même temps."},
 {id:"a2",e:0,lon:5.2,lat:47.6,t:"Le **papier** a été inventé en Chine. Il est arrivé en Europe grâce aux Arabes. Sans papier, pas d'imprimerie !"},
 {id:"a3",e:0,lon:13.7,lat:42.75,t:"Les Romains écrivaient les nombres avec des lettres : **XVI** veut dire 16. On s'en sert encore pour les siècles et pour les rois : François I**er**, **XVIe** siècle."},
 {id:"a4",e:0,lon:1.6,lat:46.3,t:"Le roi **Louis XI** crée la poste royale : des cavaliers changent de cheval à chaque relais pour porter très vite les lettres du roi."},
 {id:"s1",e:1,lon:6.5,lat:44.95,t:"Pour aller en Italie, l'armée du roi doit traverser les **Alpes** avec ses canons. Quelle escalade !"},
 {id:"s2",e:1,lon:8.95,lat:44.62,t:"**Christophe Colomb** est né à Gênes, en Italie. En **1492**, il arrive en Amérique. Sur ta frise, c'est le début des **Temps modernes**."},
 {id:"s3",e:1,lon:2.2,lat:43.9,t:"Le sport préféré des rois s'appelle le **jeu de paume**. C'est l'ancêtre du tennis : au début, on frappait la balle avec la main !"},
 {id:"s4",e:2,lon:6.95,lat:48.28,t:"En 1507, une carte du monde donne pour la première fois un nom au nouveau continent : **America**. Elle est imprimée à Saint-Dié, dans les Vosges !"},
 {id:"s5",e:2,lon:.3,lat:49.2,t:"Vers 1500, la France compte environ **16 millions** d'habitants. Presque tous sont des paysans."},
 {id:"s6",e:2,lon:9.15,lat:42.2,t:"La **Corse** n'est pas française à cette époque ! Elle appartient à la ville italienne de Gênes."},
 {id:"s7",e:3,lon:2.2,lat:50.5,t:"En 1520, François Ier rencontre le roi d'Angleterre près de Calais. Les tentes sont tissées de fils d'or : c'est le **Camp du Drap d'Or**."},
 {id:"s8",e:3,lon:.4,lat:49.55,t:"En 1517, François Ier fait construire un nouveau port à l'embouchure de la Seine : **Le Havre**."},

      else{info.innerHTML=`<strong>${n[1]}</strong> ne peut pas devenir roi maintenant. ${E.aide} Regarde : sa case clignote.`;

    c=`<p>Ce que la Renaissance doit aux <strong>Grecs</strong> et aux <strong>Romains</strong>. Tu as trouvé <strong>${vus.length} / ${tout.length}</strong> idées venues de l'Antiquité.</p>`+(vus.length?"<ul>"+vus.map(x=>`<li>${fmt(x[2])} <span style="color:var(--gris);font-size:15px">(${x[0].n})</span></li>`).join("")+"</ul>":"<p>Elles apparaîtront ici quand tu liras les fiches marquées 🏛️.</p>")}

    <p><button class="btn" id="s-copie" style="border:2px solid var(--encre);box-shadow:none">Copier le code</button> <button class="btn" id="s-joueurs" style="border:2px solid var(--encre);box-shadow:none">Changer de joueur</button></p>
    <h3>Temps de lecture</h3><p>Le bouton « Suite » attend que la fiche soit lue.</p><div class="choix bacs" id="s-tempo">${[["Court",.5],["Normal",1],["Long",1.5]].map(t=>`<button data-t="${t[1]}" class="${BASE.tempo===t[1]?"juste":""}">${t[0]}</button>`).join("")}</div>
    <h3>Effacer</h3><p><button class="btn" id="s-suppr" style="border:2px solid var(--non);color:var(--non);box-shadow:none">Supprimer le joueur ${esc(j.nom)}</button></p>`}
  ouvreFiche(`<div class="tete"><h2>Mon carnet</h2><button class="x" id="f-x" aria-label="Fermer">✕</button></div><div class="onglets" style="padding-top:10px">${noms.map((n,i)=>`<button data-o="${i}" class="${i===onglet?"ici":""}">${n}</button>`).join("")}</div><div class="fiche">${c}</div>`);
  $("#f-x").onclick=fermeFiche;document.querySelector(".onglets").onclick=e=>{const b=e.target.closest("button");if(b)carnet(+b.dataset.o)};
  if(onglet===4){
    $("#s-copie").onclick=()=>{const t=codeDe(BASE.joueurs[BASE.actif]);try{navigator.clipboard.writeText(t).then(()=>toast("Code copié."),()=>toast("Copie impossible ici. Note le code à la main."))}catch(e){toast("Copie impossible ici. Note le code à la main.")}};
    $("#s-joueurs").onclick=()=>ecranJoueurs();

function codeDe(j){const s=j.S;return "SAL-"+propre(j.nom)+"-"+s.ep+s.max+"-"+LIEUX.map(l=>s.lieux[l.id]==="or"?"o":s.lieux[l.id]?"a":"0").join("")+"-"+SALAMANDRES.map(x=>s.sal[x.id]?1:0).join("")}
function lisCode(t){const p=String(t).trim().split("-");if(p.length!==5||p[0].toUpperCase()!=="SAL")return null;
  const nom=propre(p[1]),a=p[3],b=p[4];if(!nom||!/^[0-4][0-4]$/.test(p[2])||a.length!==LIEUX.length||/[^0ao]/.test(a)||b.length!==SALAMANDRES.length||/[^01]/.test(b))return null;
  const s=vide();s.max=+p[2][1];s.ep=Math.min(+p[2][0],s.max);

  SALAMANDRES.forEach((x,i)=>{if(b[i]==="1")s.sal[x.id]=1});for(let e=0;e<=s.max;e++)s.intro[e]=1;
  return{nom,S:s}}
function activer(i){BASE.actif=i;S=Object.assign(vide(),BASE.joueurs[i].S);pile.length=0;P=null;$("#panneau").hidden=true;sauve();fermeFiche();vaEpoque(S.ep);toast("Bonjour **"+esc(BASE.joueurs[i].nom)+"** ! Ta partie est enregistrée toute seule sur cet appareil.")}

 presse(el,j,c){
  const mot="LIVRE";let cases=[],dispo=melange(mot.split("").map((l,i)=>({l,i})));
  el.innerHTML=`<p class="q">Imprime le mot <strong>LIVRE</strong>. Attention : les lettres en métal sont <strong>à l'envers</strong>, comme dans un miroir. Sur la feuille, tout s'inverse !</p>

  const C=el.querySelector("#pr-c"),D=el.querySelector("#pr-d"),I=el.querySelector("#pr-i"),F=el.querySelector("#pr-f"),r=el.querySelector("#j-r");let fini=false;

  D.onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled||fini)return;cases.push(dispo.find(d=>d.i===+b.dataset.i));maj()};
